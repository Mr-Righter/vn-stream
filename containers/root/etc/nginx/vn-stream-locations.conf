# Keep redirects relative to the browser's published endpoint.
absolute_redirect off;
# A cookie must never authorize a foreign media handshake or mutation.
set $expected_origin "$scheme://$http_host";
set $request_origin $http_origin;
if ($request_origin = "") { set $request_origin $expected_origin; }
if ($request_origin != $expected_origin) { return 403; }

# Only fixed install resources are public; business and media stay authenticated.
location = /manifest.webmanifest {
  limit_except GET HEAD { deny all; }
  proxy_pass http://127.0.0.1:8000/manifest.webmanifest;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location = /favicon.ico {
  limit_except GET HEAD { deny all; }
  alias /opt/vn-stream/web/favicon.ico;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff always;
}
location = /app-icons/icon-32.png {
  limit_except GET HEAD { deny all; }
  alias /opt/vn-stream/web/app-icons/icon-32.png;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff always;
}
location = /app-icons/icon-192.png {
  limit_except GET HEAD { deny all; }
  alias /opt/vn-stream/web/app-icons/icon-192.png;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff always;
}
location = /app-icons/icon-512.png {
  limit_except GET HEAD { deny all; }
  alias /opt/vn-stream/web/app-icons/icon-512.png;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff always;
}

# Only Nginx can call the session verifier. Strip the client body and method.
location = /_session-check {
  internal;
  proxy_pass http://127.0.0.1:8000/api/v2/auth/verify;
  proxy_method GET;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Original-URI $request_uri;
}
location = /api/v2/auth/verify { return 404; }
location ^~ /api/v2/auth/verify/ { return 404; }
location = /library { return 302 /library/; }
location = /api/v2/session/control {
  proxy_pass http://127.0.0.1:8000/api/v2/session/control;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_read_timeout 75s;
}
# Save files have a bounded 64 MiB direct upload; archive/directory chunks stay 8 MiB.
location ~ "^/api/v2/projects/[0-9a-f]{32}/saves/upload$" {
  client_max_body_size 64m;
  client_body_timeout 120s;
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
  proxy_request_buffering off;
}
location /api/v2/ {
  client_max_body_size 9m;
  client_body_timeout 120s;
  proxy_pass http://127.0.0.1:8000/api/v2/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
  proxy_request_buffering off;
}
location = /api/v1 { return 404; }
location ^~ /api/v1/ { return 404; }
location /library/api/ { return 404; }
location /library/ {
  proxy_pass http://127.0.0.1:8000/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location /api {
  auth_request /_session-check;
  proxy_pass http://127.0.0.1:8082;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}
# Only document navigations redirect; media/assets retain their 401 status.
location = / {
  add_header Cache-Control "no-store" always;
  auth_request /_session-check;
  auth_request_set $login_url $upstream_http_x_login_url;
  error_page 401 = @login;
  sub_filter '</body>' '<script type="module" src="/library/game-controls.js"></script></body>';
  sub_filter_once on;
  root /usr/share/selkies/web;
  try_files /index.html =404;
}
location = /index.html {
  add_header Cache-Control "no-store" always;
  auth_request /_session-check;
  auth_request_set $login_url $upstream_http_x_login_url;
  error_page 401 = @login;
  sub_filter '</body>' '<script type="module" src="/library/game-controls.js"></script></body>';
  sub_filter_once on;
  root /usr/share/selkies/web;
}
location @login { return 302 $login_url; }
location / {
  auth_request /_session-check;
  alias /usr/share/selkies/web/;
  try_files $uri $uri/ =404;
}
