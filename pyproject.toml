[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-stream"
version = "1.0.0"
description = "Self-hosted multi-engine visual novel library and streaming service"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "anyio==4.16.0",
    "uvicorn>=0.30,<1",
    "wsproto==1.3.2",
    "pyzipper==0.3.6",
    "py7zr==1.1.0",
    "rarfile==4.2",
    "pycryptodome==3.23.0",
    "pefile==2024.8.26",
    "Pillow==12.0.0",
    "ecdsa==0.19.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.9,<1", "hypothesis==6.170.15", "mypy==2.4.1", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/vn_stream/api/app.py" = ["B008"]

[tool.setuptools.package-data]
"vn_stream.i18n" = ["locales/*.json"]

"vn_stream.ui" = ["theme.json"]

"vn_stream.engines.renpy.hooks" = ["*.rpy"]
